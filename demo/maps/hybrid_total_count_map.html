            marker_cluster_894fd163bb14d69443e5fde5d17c7323.options.iconCreateFunction =
                function(cluster) {
        var children = cluster.getChildren();
        var totalCount = 0;

        // --- THIS IS THE NEW LOGIC ---
        // Iterate over children and sum up their 'count' property
        for (var i = 0; i < children.length; i++) {
            if (children[i].options && children[i].options.count) {
                totalCount += children[i].options.count;
            }
        }
        // --- END NEW LOGIC ---

        var c = ' marker-cluster-';
        var color, bcolor;
        var size = 40;

        // --- These counts are now for TOTAL TRIPS ---
        if (totalCount < 500) { 
            c += 'xxsmall';
            color = 'rgba(0, 200, 255, 0.7)'; // Blue
        } else if (totalCount < 2000) {
            c += 'xsmall';
            color = 'rgba(0, 0, 150, 0.7)'; // Dark Blue
        } else if (totalCount < 5000) {
            c += 'small';
            color = 'rgba(0, 0, 100, 0.7)'; // Green-ish
        } else if (totalCount < 10000) {
            c += 'medium';
            color = 'rgba(255, 255, 0, 0.7)'; // Yellow
        } else if (totalCount < 20000) {
            c += 'large';
            color = 'rgba(255, 100, 0, 0.8)'; // Orange
        } else {
            c += 'xlarge';
            color = 'rgba(255, 0, 0, 0.8)'; // Red
        }

        return new L.DivIcon({
            // Display the totalCount (sum of trips)
            html: '<div style="background-color:' + color + '; color: white; font-weight:bold;"><span>' + totalCount + '</span></div>',
            className: 'marker-cluster' + c,
            iconSize: new L.Point(size, size)
        });
    };
